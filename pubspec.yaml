name: sensei_tunnel
description: A powerful mobile proxy client based on ClashMeta, rebranded as Sensei Tunnel. Simple, fast, and secure.
publish_to: 'none'
version: 1.0.0+1 # আপনার প্রথম ভার্সন

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  path_provider: ^2.1.0
  path: ^1.9.0
  shared_preferences: ^2.5.3
  dynamic_color: ^1.8.1 # অ্যান্ড্রয়েড মেটেরিয়াল ইউ সাপোর্টের জন্য রাখা হয়েছে
  proxy:
    path: plugins/proxy
  json_annotation: ^4.9.0
  file_picker: ^8.0.0
  mobile_scanner: ^7.0.1
  app_links: ^6.4.0
  collection: ^1.18.0
  animations: ^2.1.1
  package_info_plus: ^5.0.1
  url_launcher: ^6.3.2
  freezed_annotation: ^3.1.0
  image_picker: ^1.2.0
  ffi: ^2.1.4
  webdav_client: ^1.2.2
  dio: ^5.8.0+1
  re_editor: ^0.8.0
  re_highlight: ^0.0.3
  archive: ^4.0.7
  emoji_regex: ^0.0.5
  uni_platform: ^0.1.3
  device_info_plus: ^10.1.0
  connectivity_plus: ^6.0.0
  defer_pointer: ^0.0.2
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0
  riverpod: ^3.0.0
  material_color_utilities: ^0.11.1
  flutter_js:
    git:
      url: https://github.com/chen08209/flutter_js
      ref: master
  flutter_svg: ^2.1.0
  flutter_cache_manager: ^3.4.1
  crypto: ^3.0.3
  yaml: ^3.1.3
  yaml_writer:
    git:
      url: https://github.com/chen08209/yaml_writer
      ref: master
  super_sliver_list: ^0.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  json_serializable: ^6.7.1
  build_runner: ^2.7.0
  args: ^2.4.2
  freezed: ^3.2.0
  riverpod_generator: ^3.0.0
  riverpod_lint: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/fonts/
    - assets/images/
    - assets/images/avatar/
    - assets/images/empty/
    - assets/images/icon/
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
    - family: Twemoji
      fonts:
        - asset: assets/fonts/Twemoji.Mozilla.ttf
    - family: Icons
      fonts:
        - asset: assets/fonts/Icons.ttf

flutter_intl:
  enabled: true
  class_name: AppLocalizations
  arb_dir: arb
  output_dir: lib/l10n
